name: Sync skill data & deploy Pages

on:
  schedule:
    - cron: "0 */6 * * *"      # 每 6 小時自動同步一次（UTC）
  workflow_dispatch:            # 也可在 Actions 頁面手動觸發
  push:
    branches: [main]
    paths-ignore:
      - "data/skills.json"      # 機器人自己提交時不再觸發，避免循環

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取三個商店資料
        run: node scripts/collect.js
        env:
          COCO_PAGES: "20"
          CLAW_LIMIT: "300"

      - name: 提交快照（有變更才提交）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skills.json
          if git diff --cached --quiet; then
            echo "資料無變更，跳過提交"
          else
            git commit -m "chore: sync skills snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 打包站點
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
